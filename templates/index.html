<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search Engine</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/style.css">

    <style>
        .image-preview {
            max-width: 300px;
            max-height: 300px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
        .file-input {
            display: none;
        }
        .list-group-item-remove {
            cursor: pointer;
            color: red;
            font-weight: bold;
        }
        .list-group-item-remove:hover {
            color: darkred;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-4">
        <h1>🔍 Image Search Engine</h1>
        <p class="text-muted">Search by text or upload an image</p>
    </div>

    <div class="search-container mx-auto" style="max-width: 600px;">
        <form action="/search" method="POST" enctype="multipart/form-data">
            <div class="input-group mb-3">
                <!-- Text input -->
                <input type="text" id="textQuery" name="text" class="form-control" placeholder="Search for anything...">

                <!-- Search button -->
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search"></i>
                </button>

                <!-- Image upload button -->
                <label class="btn btn-secondary mb-0">
                    <i class="fas fa-file-image"></i>
                    <input type="file" id="imageUpload" name="query" accept="image/*" hidden onchange="previewImage(event)">
                </label>
            </div>

            <!-- Image Preview -->
            <div class="text-center">
                <img id="imagePreview" class="img-thumbnail" src="#" alt="Image Preview">
            </div>
        </form>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="../static/main.js"></script>

<script>
    // Hiển thị ảnh preview khi upload
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
            const output = document.getElementById('imagePreview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }

    // Xóa tìm kiếm gần đây
    document.querySelectorAll('.list-group-item-remove').forEach(button => {
        button.addEventListener('click', function () {
            this.closest('li').remove();
        });
    });
</script>

</body>
</html>
